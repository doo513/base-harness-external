[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-harness-external"
version = "0.8.0"
description = "Model-free Develop Harness with persistent Runs and local advisory verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pytest-adapter = ["pytest>=8,<10"]

[project.scripts]
base-harness-external = "harness_external.__main__:main"
harness-explore = "change_lens.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness", "harness_external", "change_lens"]

[tool.setuptools.package-data]
harness_external = ["develop_manifest.json", "develop_analysis_map.json"]
