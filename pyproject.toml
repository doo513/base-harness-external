[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-harness-external"
version = "0.4.0"
description = "Model-free Develop Harness with persistent Runs and local advisory verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
base-harness-external = "harness_external.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness", "harness_external"]

[tool.setuptools.package-data]
harness_external = ["develop_manifest.json"]
